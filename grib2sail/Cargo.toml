[package]
name = "grib2sail"
description = "Grib files downloader for sailing purposes"
version = "0.7.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ch1nkara/GRIB2Sail"
readme = "../README.md"

[lib]
name = "grib2sail"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
log = { version = "0.4.29", features = ["std"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
rust-aec = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum_macros = "0.27.2"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

