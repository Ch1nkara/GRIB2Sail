[package]
name = "grib2sail"
description = "Grib files downloader for sailing purposes"
version = "0.5.0-alpha.6"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ch1nkara/GRIB2Sail"

[[bin]]
name = "grib2sail-cli"
path = "src/main.rs"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
colored = "3.1.1"
env_logger = "0.11.8"
futures = "0.3.31"
indicatif = "0.18.3"
keyring = "3.6.3"
log = "0.4.29"
reqwest = "0.13.2"
self_update = "0.42.0"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

