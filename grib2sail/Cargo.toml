[package]
name = "grib2sail"
description = "Grib files downloader for sailing purposes"
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ch1nkara/GRIB2Sail"
readme = "../README.md"

[[bin]]
name = "grib2sail-cli"
path = "src/main.rs"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.5.57", features = ["derive"] }
colored = "3.1.1"
env_logger = "0.11.8"
futures = "0.3.31"
indicatif = "0.18.3"
keyring = { version = "3.6.3", features = [
  "sync-secret-service", "vendored", "crypto-rust",
  "windows-native",
  "apple-native"
] }
log = "0.4.29"
once_cell = "1.21.3"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
self_update = { version = "0.42.0", features = [
  "archive-tar", "compression-flate2",
  "archive-zip", "compression-zip-deflate", "compression-zip-bzip2"
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

